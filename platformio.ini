; KEF LS50 Wireless II remote for the Elecrow CrowPanel 2.1" rotary display
; (ESP32-S3R8, 16 MB flash, 8 MB OPI PSRAM, ST7701 480x480 RGB panel, CST826 touch).
;
; Uses the pioarduino platform (Arduino core 3.x / ESP-IDF 5), which is what
; Elecrow's current reference sketch targets (LVGL 9.1 + Arduino_GFX 1.6.7).
;
; NOTE: custom_sdkconfig makes this an ESP-IDF build, which fails if the
; project path contains a space. Keep the folder name space-free.

[env:crowpanel21]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DCORE_DEBUG_LEVEL=1

; Rebuilds the ESP-IDF libraries with Espressif's recommended settings for RGB
; panels (as in pioarduino's own S3 display example). Without them the panel's
; DMA stream from PSRAM underruns: flickering lines and a jumping image.
;  - XIP from PSRAM keeps PSRAM readable while flash is busy (Wi-Fi/NVS writes)
;  - IRAM-safe ISRs keep the bounce buffers refilling during flash operations
;  - bigger data cache, and Wi-Fi/LWIP buffers kept out of PSRAM
; The first build after changing this takes a while.
custom_sdkconfig =
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
    CONFIG_GDMA_CTRL_FUNC_IN_IRAM=y
    CONFIG_GDMA_ISR_IRAM_SAFE=y
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
    CONFIG_SPIRAM_RODATA=y
    CONFIG_ESP32S3_DATA_CACHE_64KB=y
    CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
    '# CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP is not set'

; Components this project doesn't use (speeds up the framework rebuild).
custom_component_remove =
    espressif/esp_hosted
    espressif/esp_wifi_remote
    espressif/network_provisioning
    espressif/mdns
    espressif/esp-dsp
    espressif/esp_modem
    espressif/esp32-camera
    espressif/libsodium
    espressif/esp-modbus
    espressif/qrcode
    espressif/esp_insights
    espressif/esp_diag_data_store
    espressif/esp_diagnostics
    espressif/cbor
    espressif/esp_rainmaker
    espressif/rmaker_common
    chmorgan/esp-libhelix-mp3
lib_ignore =
    ble
    dsp
    Matter
    Zigbee
    ESP RainMaker
    Insights
    WiFiProv

lib_deps =
    lvgl/lvgl@9.1.0
    moononournation/GFX Library for Arduino@1.6.7
    adafruit/Adafruit BusIO@1.16.2
    adafruit/Adafruit CST8XX Library@1.1.1
    xreef/PCF8574 library@2.3.7
    bblanchon/ArduinoJson@^7.2.0
